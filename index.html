<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>강한 놀이터</title>
<meta name="description" content="강한 자만 살아남던 옛날 놀이터. 브라우저에서 바로 들어가 친구들과 같이 노는 3D 놀이터.">
<meta name="theme-color" content="#9fd4f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 90년대 동네 놀이터 밈 — 과장된 경고문, 장난스러운 생존 게임
   IDEA: 옛날 놀이터 안내판과 "강한 자만 살아남던" 인포그래픽 포스터
   PICTURE: 화면 가득한 3D 모래 놀이터, 원색 페인트 철제 기구, 반쯤 묻힌 타이어
   COLOUR and TYPE: 하늘색 · 모래색 · 빨강/노랑/초록 페인트, Black Han Sans + Noto Sans KR
   LAYOUT: 풀스크린 게임, 위쪽 상태 칩, 왼쪽 아래 조이스틱, 오른쪽 아래 행동 버튼 */
:root{color-scheme:light dark;--ink:#16202b;--paper:#fffdf5;--red:#d7372b;--yel:#ffcf33;--sky:#9fd4f2;--grn:#2f8a5a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font:15px/1.45 "Noto Sans KR",system-ui,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;touch-action:none;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 10px)}
.chip{pointer-events:auto;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:5px 10px;font-weight:700;font-size:14px;white-space:nowrap}
button.chip{font-family:inherit;cursor:pointer}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font:400 19px/1.15 "Black Han Sans",sans-serif;background:var(--yel);padding:6px 10px}
.hp{display:flex;align-items:center;gap:8px;width:170px}
.bar{flex:1;height:12px;border:2px solid var(--ink);border-radius:7px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;width:100%;background:var(--grn);transition:width .25s,background .25s}
#rtag{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 58px);background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:none}
#rtag b{color:var(--yel);font-weight:900}
#acts{position:fixed;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column-reverse;gap:10px;align-items:flex-end;pointer-events:auto}
.act{font:400 19px/1 "Black Han Sans",sans-serif;min-width:132px;min-height:56px;padding:0 18px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.act:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.act.p{background:var(--yel);min-height:70px;font-size:22px}
.act.r{background:var(--red);color:#fff}
.act.g{background:var(--sky)}
#meter{position:fixed;right:calc(env(safe-area-inset-right) + 12px);width:170px;pointer-events:none}
#meter span{display:block;font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 2px #000a;margin-bottom:3px}
#meter .bar{height:14px}#meter .bar i{background:var(--red)}
#joy{position:fixed;left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 26px);width:132px;height:132px;border-radius:50%;background:rgba(255,253,245,.35);border:3px solid rgba(22,32,43,.55);pointer-events:auto;touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:var(--yel);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
#mini{position:fixed;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 54px);width:170px;height:170px;border-radius:18px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#7aa84c}
@media (pointer:coarse){#joy{display:block}#keys{display:none}#mini{width:124px;height:124px;bottom:calc(env(safe-area-inset-bottom) + 172px);left:calc(env(safe-area-inset-left) + 26px)}}
#keys{position:fixed;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 14px);font-weight:400;font-size:13px}
#toast{position:fixed;left:50%;top:21%;transform:translate(-50%,-8px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;width:min(92vw,560px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tA{font:400 clamp(30px,8vw,46px)/1.05 "Black Han Sans",sans-serif;color:var(--red);text-shadow:3px 0 #fff,-3px 0 #fff,0 3px #fff,0 -3px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff,5px 5px 0 var(--ink);text-wrap:balance}
#tB{display:inline-block;margin-top:8px;background:var(--ink);color:#fff;padding:5px 12px;border-radius:10px;font-weight:700;font-size:15px}
#tB:empty{display:none}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);background:rgba(22,32,43,.38);overflow:auto;z-index:5}
.ov[hidden]{display:none}
.card{background:var(--sky);border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink);padding:22px 20px 20px;width:min(100%,460px);margin:auto}
.card h1{font:400 clamp(32px,9vw,44px)/1.05 "Black Han Sans",sans-serif;margin:0 0 10px;text-align:center;text-wrap:balance}
.card h1 em{font-style:normal;display:block;color:var(--red);font-size:1.18em}
.card p{margin:0 0 12px;font-size:15px}
.rides{list-style:none;padding:0;margin:0 0 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rides li{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:5px 8px;font-size:13px;line-height:1.3}
.rides b{display:block;font-size:14px}.rides span{color:var(--red);font-weight:700}
label.l{display:block;font-weight:900;margin:0 0 5px}
#nm{width:100%;font:700 16px "Noto Sans KR",sans-serif;padding:11px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:12px}
#nm:focus-visible,.sw:focus-visible,.act:focus-visible,button.chip:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.pvw{position:relative;height:150px;margin:0 0 8px;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:linear-gradient(#bfe4f7,#e9d3a6)}
#pv{position:absolute;inset:0;width:100%;height:100%;display:block}
#pvT{position:absolute;left:10px;bottom:8px;right:10px;font-size:13px;font-weight:700;background:rgba(255,253,245,.92);border:2px solid var(--ink);border-radius:9px;padding:3px 8px;white-space:normal}
#pvT b{font:400 16px "Black Han Sans",sans-serif;margin-right:4px}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 12px}
.ch{font:inherit;text-align:center;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:11px;padding:6px 8px;min-height:50px;cursor:pointer;line-height:1.25}
.ch b{display:block;font-size:14px}.ch span{font-size:12px;color:var(--red);font-weight:700}
.ch[aria-pressed=true]{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
.ch:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sws{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
#go{width:100%;min-height:58px;font-size:24px}
.fine{font-size:13px;margin:12px 0 0;text-align:center;opacity:.85}
.st{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
.st li{display:flex;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:7px 10px;font-size:14px}
.st li.ok{background:var(--yel)}
.st small{color:#6b5a3a;font-size:13px}
.st i{font-style:normal;font-weight:900;white-space:nowrap}
.pnl{background:var(--paper)}
.gear{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:36px;padding:4px 8px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-bottom:14px}
.tab{font:700 14px "Noto Sans KR",sans-serif;min-height:44px;padding:4px 2px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;line-height:1.15}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.tab:focus-visible,.pill:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.dsub{font-size:13px;margin:0 0 8px;color:#5c5240}
.dl{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px}
.dl li{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:700}
.dl li i{position:absolute;left:0;bottom:0;height:5px;background:var(--grn)}
.dl li.ok{background:var(--yel)}.dl b{font-variant-numeric:tabular-nums;white-space:nowrap}
.att{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.att div{background:var(--sky);border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;text-align:center}
.att b{font:400 34px/1 "Black Han Sans",sans-serif}.att span{display:block;font-size:13px;font-weight:700}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.pill{flex:none;font:700 13px "Noto Sans KR",sans-serif;min-height:38px;padding:0 12px;border:2px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);cursor:pointer}
.pill[aria-pressed=true]{background:var(--yel)}
.lb{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.lb li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:7px 10px;font-size:15px}
.lb li.me{background:var(--yel)}.lb em{font:400 18px "Black Han Sans",sans-serif;font-style:normal;text-align:center}
.lb li:nth-child(1) em{color:var(--red)}.lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.lb b{white-space:nowrap;font-variant-numeric:tabular-nums}
.lb li.empty{display:block;text-align:center;font-weight:700}
.setb{display:grid;gap:10px}.setb .act{width:100%}
#dayBtn.done{background:var(--grn);color:#fff}
#err[hidden]{display:none}#err{position:fixed;inset:0;display:grid;place-items:center;padding:20px;text-align:center;font-weight:700}
@media(max-width:600px){#rtag{top:calc(env(safe-area-inset-top) + 98px)}.hp{width:130px}.brand{font-size:16px}.act{min-width:112px;font-size:17px}.act.p{font-size:20px;min-height:64px}#meter{width:140px}}
@media(prefers-reduced-motion:reduce){#toast,#fx{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err" hidden>3D 엔진을 불러오지 못했어요. 새로고침해 주세요.</div>
<div id="fx"></div>

<div class="hud">
  <div class="top">
    <div class="chip brand">강한 놀이터</div>
    <div class="chip hp"><span>체력</span><div class="bar"><i id="hpb"></i></div><span id="hpn">100</span></div>
    <button class="chip" id="dayBtn" type="button">오늘의 도전 <span id="dayN">0</span>/3</button>
    <button class="chip" id="lbBtn" type="button">기록판</button>
    <button class="chip" id="menuBtn" type="button">메뉴</button>
    <button class="chip gear" id="setBtn" type="button" aria-label="설정"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
    <div class="chip" id="online">혼자 노는 중</div>
    <div class="chip" id="clock"></div>
  </div>
  <div class="chip" id="rtag" hidden></div>
  <div id="meter" hidden><span id="mL"></span><div class="bar"><i id="mB"></i></div></div>
  <div id="joy"><div id="knob"></div></div>
  <canvas id="mini" width="300" height="300" aria-label="미니맵"></canvas>
  <div class="chip" id="keys">WASD 이동 · 스페이스 점프 · E 타기/행동 · Q 내리기 · 드래그로 시점</div>
</div>
<div id="acts"></div>
<div id="toast"><div id="tA"></div><div id="tB"></div></div>

<div class="ov" id="intro">
  <form class="card" id="introF">
    <h1>강한 자만 살아남던<em>옛날 놀이터</em></h1>
    <p>기구에 다가가서 <b>타기</b>를 누르세요. 다 타고 살아남으면 생존 도장 9개. 체력이 0이 되면 엄마가 데리러 옵니다.</p>
    <p style="margin-top:-4px">구름다리 · 그네 · 정글짐 · 늑목 · 지구본 · 미끄럼틀 · 시소. 캐릭터마다 특기가 달라요.</p>
    <label class="l" for="nm">닉네임</label>
    <input id="nm" maxlength="12" autocomplete="off" spellcheck="false">
    <label class="l">캐릭터</label>
    <div class="pvw"><canvas id="pv"></canvas><div id="pvT"></div></div>
    <div class="chars" id="chars"></div>
    <label class="l">옷 색깔</label>
    <div class="sws" id="sws"></div>
    <button class="act p" id="go" type="submit">놀이터 입장</button>
    <p class="fine">같은 링크로 들어온 사람들이 놀이터에 함께 보입니다.<br>가상 놀이터입니다. 실제로 따라 하지 마세요.</p>
  </form>
</div>

<div class="ov" id="setPanel" hidden>
  <div class="card pnl">
    <h1 style="font-size:32px">설정</h1>
    <div class="setb"><button class="act g" id="chBtn" type="button">캐릭터 바꾸기</button><button class="act g" id="bgmBtn" type="button">배경음악 켬</button><button class="act g" id="mute" type="button">소리 켬</button></div>
    <button class="act p" id="sClose" type="button" style="width:100%;margin-top:12px">닫기</button>
  </div>
</div>
<div class="ov" id="panel" hidden>
  <div class="card pnl">
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-t="day">도전</button>
      <button class="tab" type="button" role="tab" data-t="lb">기록판</button>
      <button class="tab" type="button" role="tab" data-t="st">도장 <span id="stN">0</span>/9</button>
    </div>
    <section data-p="day"><div id="dayBox"></div></section>
    <section data-p="lb" hidden><div class="pills" id="lbPills"></div><ol class="lb" id="lbList"></ol><p class="fine" id="lbNote"></p></section>
    <section data-p="st" hidden><ul class="st" id="stList"></ul></section>
    <button class="act p" id="pClose" type="button" style="width:100%;margin-top:12px">닫기</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/supabase.min.js"></script>
<script src="supabase-bridge.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').hidden=false;return}
const T=THREE,V=(x,y,z)=>new T.Vector3(x,y,z),UP=V(0,1,0),$=s=>document.querySelector(s);
const PI=Math.PI,rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),angLerp=(a,b,k)=>a+wrap(b-a)*k;
const isTouch=matchMedia('(pointer:coarse)').matches;
const store={get(k,d){try{const v=localStorage.getItem('kp_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('kp_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- renderer & scene ---------- */
const canvas=$('#c');
const R=new T.WebGLRenderer({canvas,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,isTouch?1.75:2));
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const S=new T.Scene();S.background=new T.Color(0x9fd4f2);S.fog=new T.Fog(0xcfe8f1,45,120);
const cam=new T.PerspectiveCamera(55,1,.1,300);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?70:55;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const hemi=new T.HemisphereLight(0xe8f5ff,0xc9a26c,.82);S.add(hemi);
const sun=new T.DirectionalLight(0xfff0d2,.85);sun.position.set(18,30,14);sun.castShadow=true;
const sm=isTouch?1024:2048;sun.shadow.mapSize.set(sm,sm);
Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:80});sun.shadow.bias=-.0008;S.add(sun);

const mats={},M=c=>mats[c]||(mats[c]=new T.MeshLambertMaterial({color:c}));
function mesh(g,c,p){const m=new T.Mesh(g,M(c));m.castShadow=true;m.receiveShadow=true;if(p)p.add(m);return m}
function box(w,h,d,c,p,x=0,y=0,z=0){const m=mesh(new T.BoxGeometry(w,h,d),c,p);m.position.set(x,y,z);return m}
function tube(a,b,r,c,p){const d=V().subVectors(b,a),L=d.length(),m=mesh(new T.CylinderGeometry(r,r,L,8),c,p);m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(UP,d.normalize());return m}
function flatDisc(r,c,x,z,y){const m=mesh(new T.CircleGeometry(r,40),c,S);m.rotation.x=-PI/2;m.position.set(x,y,z);m.castShadow=false;return m}
const RED=0xc8322b,YEL=0xe2a62a,GRN=0x2f7a52,BLU=0x6db6e3,ORG=0xe8892b,TEAL=0x2f6f6a;
const cols=[];

/* ---------- ground, trees, town ---------- */
const grass=mesh(new T.PlaneGeometry(300,300),0x7aa84c,S);grass.rotation.x=-PI/2;grass.castShadow=false;
flatDisc(23,0xcfae7a,0,0,.02);
[[0,-4,9,0xb99f78],[-4,7,6,0xc2a47b],[9,2,5,0xc6a777],[-12,-6,4,0xbb9e74]].forEach(([x,z,r,c])=>flatDisc(r,c,x,z,.03));
for(let i=0;i<10;i++){const s=box(2.5+rnd(),.12,2.2+rnd()*.6,i%2?0xb9b4a8:0xc6c1b5,S,-12+i*2.6+rnd()*.3,.06,24.5+rnd()*1.2);s.rotation.y=(rnd()-.5)*.15;s.castShadow=false}
for(let i=0;i<40;i++){const a=rnd()*PI*2,r=21+rnd()*3;const t=mesh(new T.ConeGeometry(.12,.35,4),0x6f9e45,S);t.position.set(Math.cos(a)*r,.15,Math.sin(a)*r)}
const leafC=[0x4f8b3b,0x5e9e45,0x3f7a34,0x6aab4c];

  mg.textAlign='center';mg.textBaseline='middle';
  for(const[x,z,n]of MINI){const px=c+x*k,py=c+z*k;if(!n){mg.fillStyle='#8a5a2e';mg.fillRect(px-7,py-4,14,8);continue}mg.fillStyle='#d7372b';mg.beginPath();mg.arc(px,py,7,0,PI*2);mg.fill();mg.strokeStyle='#16202b';mg.lineWidth=2.5;mg.stroke();
    mg.font='900 25px "Noto Sans KR",sans-serif';mg.lineWidth=5;mg.strokeStyle='#fffdf5';mg.strokeText(n,px,py+22);mg.fillStyle='#16202b';mg.fillText(n,px,py+22)}
  for(const o of peers.values()){const g=o.k.g.position;mg.fillStyle='#2f7ae5';mg.beginPath();mg.arc(c+g.x*k,c+g.z*k,7,0,PI*2);mg.fill();mg.strokeStyle='#fff';mg.lineWidth=2.5;mg.stroke()}
  if(entered){let px=c+P.pos.x*k,py=c+P.pos.z*k;px=clamp(px,14,W-14);py=clamp(py,14,W-14);const a=P.ry;mg.save();mg.translate(px,py);mg.rotate(-a);
    mg.fillStyle='#ffcf33';mg.strokeStyle='#16202b';mg.lineWidth=3;mg.beginPath();mg.moveTo(0,15);mg.lineTo(10,-9);mg.lineTo(0,-3);mg.lineTo(-10,-9);mg.closePath();mg.fill();mg.stroke();mg.restore();
    mg.strokeStyle='rgba(22,32,43,.35)';mg.lineWidth=2;mg.beginPath();mg.moveTo(px,py);mg.lineTo(px-Math.sin(camYaw)*30,py-Math.cos(camYaw)*30);mg.stroke()}}
function hud(){minimap();
  let list=[];
  if(entered&&P.ko<=0&&!(P.stun>0&&!P.ride)){
    if(P.ride)list=P.ride.d.buttons(P.ride.s);
    else{list=[{t:'점프',c:'g',f:jump}];const n=nearRide();if(n)list.unshift({t:n.verb?'미끄럼틀 거꾸로 오르기':n.name+(n.id.startsWith('bench')?'에 앉기':' 타기'),c:'p',f:()=>enterRide(n)})}}
  cur=list;const key=list.map(b=>b.t+b.c).join('|');
  if(key!==btnKey){btnKey=key;acts.innerHTML=list.map((b,i)=>`<button class="act ${b.c}" type="button" data-i="${i}">${esc(b.t)}</button>`).join('')}
  const me=$('#meter'),mt=P.ride&&P.ride.d.meter?P.ride.d.meter(P.ride.s):null;
  if(mt){me.hidden=false;$('#mL').textContent=mt.l;$('#mB').style.width=clamp(mt.v,0,1)*100+'%';me.style.bottom=(acts.offsetHeight+30)+'px'}else me.hidden=true;
  const rt=$('#rtag');if(P.ride){rt.hidden=false;const t=P.ride.d.name+' · '+P.ride.d.sub;if(rt.dataset.t!==t){rt.dataset.t=t;rt.innerHTML=esc(P.ride.d.name)+' · <b>'+esc(P.ride.d.sub)+'</b>'}}else rt.hidden=true;
}

/* ---------- multiplayer (room presence) ---------- */
let room=null,lastSent=0,onlineN=1;const peers=new Map();
const num=(v,a,b)=>typeof v==='number'&&isFinite(v)?clamp(v,a,b):0;
function dropPeer(id){const o=peers.get(id);if(!o)return;S.remove(o.k.g);S.remove(o.l);o.l.material.map.dispose();o.l.material.dispose();peers.delete(id)}
function syncPeers(list){const seen=new Set();let n=0;
  for(const p of list){if(p.kind!=='viewer')continue;const q=p.presence||{};if(typeof q.x!=='number'){if(p.sameTab)n++;continue}n++;if(p.sameTab)continue;seen.add(p.peer);
    const nm=String(q.n||'친구').replace(/[\u0000-\u001f]/g,'').slice(0,12)||'친구',ci=Math.abs(q.c|0)%COLORS.length,ki=Math.abs(q.k|0)%CHARS.length;let o=peers.get(p.peer);
    if(!o||o.nm!==nm||o.ci!==ci||o.ki!==ki){if(o)dropPeer(p.peer);o={k:kid(COLORS[ci],CHARS[ki].sc,CHARS[ki].id),l:label(nm,false),nm,ci,ki,t:null};o.k.g.position.set(num(q.x,-40,40),num(q.y,-2,30),num(q.z,-40,40));peers.set(p.peer,o)}
    o.t={x:num(q.x,-40,40),y:num(q.y,-2,30),z:num(q.z,-40,40),ry:num(q.ry,-7,7),rx:num(q.rx,-7,7),rz:num(q.rz,-7,7),p:POSES.includes(q.p)?q.p:'idle',sp:!!q.sp}}
  for(const id of[...peers.keys()])if(!seen.has(id))dropPeer(id);
  onlineN=Math.max(1,n);$('#online').textContent=room?'놀이터에 '+onlineN+'명':'혼자 노는 중'}
function updatePeers(dt){const k=1-Math.exp(-12*dt);for(const o of peers.values()){const t=o.t;if(!t)continue;const g=o.k.g;
  g.position.x+=(t.x-g.position.x)*k;g.position.y+=(t.y-g.position.y)*k;g.position.z+=(t.z-g.position.z)*k;
  g.rotation.set(angLerp(g.rotation.x,t.rx,k),angLerp(g.rotation.y,t.ry,k),angLerp(g.rotation.z,t.rz,k));
  applyPose(o.k,t.p,dt,PSPD[t.p]||2);o.k.sp.visible=t.sp;o.l.position.set(g.position.x,g.position.y+(LY[t.p]||2.05)*o.k.sc,g.position.z)}}
function sendPresence(now){if(!room||!entered||now-lastSent<100)return;lastSent=now;const r2=v=>Math.round(v*100)/100;
  room.presence({n:myName,c:myColor,k:myChar,x:r2(P.pos.x),y:r2(P.vy||0),z:r2(P.pos.z),ry:r2(wrap(P.ry)),rx:r2(wrap(P.vrx||0)),rz:r2(wrap(P.rz)),p:P.vpose||'idle',sp:P.spiky>0}).catch(()=>{})}
(async()=>{try{const c=window.claude;room=c&&c.use?await c.use('room'):null}catch(e){room=null}
  if(!room){$('#online').textContent='혼자 노는 중';return}
  $('#online').textContent='놀이터에 1명';
  room.onPeers(ch=>syncPeers(ch.peers),()=>{room=null;for(const id of[...peers.keys()])dropPeer(id);$('#online').textContent='혼자 노는 중'})})();

/* ---------- intro ---------- */
const adj=['용감한','겁없는','깁스한','날쌘','무적의','코찔찔이','동네','전설의'],noun=['어린이','골목대장','막내','개구쟁이','유격대원'];
myName=store.get('name','')||(adj[(rnd()*adj.length)|0]+' '+noun[(rnd()*noun.length)|0]);myColor=store.get('color',(rnd()*COLORS.length)|0)%COLORS.length;
myChar=store.get('char',0)%CHARS.length;
$('#nm').value=myName;
$('#chars').innerHTML=CHARS.map((c,i)=>`<button type="button" class="ch" data-i="${i}" aria-pressed="${i===myChar}"><b>${c.n}</b><span>${c.p}</span></button>`).join('');
const PS=new T.Scene();PS.add(new T.HemisphereLight(0xffffff,0xc9a26c,.9));const pl=new T.DirectionalLight(0xffffff,.6);pl.position.set(3,5,4);PS.add(pl);
const pcam=new T.PerspectiveCamera(30,2,.1,50);pcam.position.set(0,1.15,3.7);pcam.lookAt(0,.82,0);
const pvc=$('#pv');let PR=null;try{PR=new T.WebGLRenderer({canvas:pvc,antialias:true,alpha:true});PR.setPixelRatio(Math.min(devicePixelRatio,2))}catch(_){PR=null}
let pk=null;
function buildPreview(){if(pk)PS.remove(pk.g);const c=CHARS[myChar];pk=kid(COLORS[myColor],c.sc,c.id,PS);
  $('#pvT').innerHTML=`<b>${c.n}</b>${c.p} · ${c.d}`;
  for(const b of document.querySelectorAll('.ch'))b.setAttribute('aria-pressed',+b.dataset.i===myChar)}
$('#chars').addEventListener('click',e=>{const b=e.target.closest('.ch');if(!b)return;myChar=+b.dataset.i;buildPreview();sfx('step')});
function drawPreview(dt){if(!PR||!pk||$('#intro').hidden)return;const w=pvc.clientWidth,h=pvc.clientHeight;if(!w||!h)return;
  if(pvc.width!==Math.round(w*PR.getPixelRatio())){PR.setSize(w,h,false);pcam.aspect=w/h;pcam.updateProjectionMatrix()}
  pk.g.rotation.y+=dt*.9;applyPose(pk,'walk',dt,5);PR.render(PS,pcam)}

$('#sws').innerHTML=COLORS.map((c,i)=>`<button type="button" class="sw" data-i="${i}" aria-label="색 ${i+1}" aria-pressed="${i===myColor}" style="background:#${c.toString(16).padStart(6,'0')}"></button>`).join('');
$('#sws').addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;myColor=+b.dataset.i;for(const s of document.querySelectorAll('.sw'))s.setAttribute('aria-pressed',s===b);buildPreview()});
buildPreview();
function audioOn(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){AC=null}}if(AC){AC.resume&&AC.resume();bgmStart()}}
addEventListener('pointerdown',audioOn,{once:true});addEventListener('keydown',audioOn,{once:true});
function enterGame(back){CH=CHARS[myChar];P.max=CH.hp;P.hp=CH.hp;P.dizzy=0;
  if(P.k){if(P.ride){if(P.ride.d.cleanup)P.ride.d.cleanup(P.ride.s);P.ride=null}S.remove(P.k.g);S.remove(P.l);P.l.material.map.dispose();P.pos.y=0;P.air=false;P.vel.set(0,0,0)}
  P.k=kid(COLORS[myColor],CH.sc,CH.id);P.l=label(myName,true);entered=true;$('#intro').hidden=true;hpUI();
  const fresh=attend();markDirty();dayUI();if(fresh)setTimeout(()=>{toast('출석 '+att.streak+'일째!','오늘의 도전: '+TODAY[0][2]+' 외 2개');sfx('ding')},2700);
  toast(back?'다시 왔구나, '+myName:CH.n+' 입장',NF>.6?'해가 졌다. 엄마가 부르기 전에 놀자':SEA.n+' 놀이터 · '+SEA.tip);if(document.activeElement)document.activeElement.blur()}
$('#introF').addEventListener('submit',e=>{e.preventDefault();audioOn();
  myName=($('#nm').value.trim().replace(/[\u0000-\u001f]/g,'')||'어린이').slice(0,12);store.set('name',myName);store.set('color',myColor);store.set('char',myChar);
  const first=!P.k;enterGame(false);if(first)camYaw=0});
$('#chBtn').addEventListener('click',()=>{$('#panel').hidden=true;$('#setPanel').hidden=true;$('#nm').value=myName;buildPreview();$('#go').textContent='이 캐릭터로 놀기';$('#intro').hidden=false});
if(store.get('name','')&&store.get('char',null)!=null){$('#go').textContent='이 캐릭터로 놀기';env();enterGame(true)}
$('#hpb').style.width='100%';

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  try{env();seasonTick(dt);clockUI(now);drawPreview(dt);if(entered)updatePlayer(dt);updateWorld(dt);updatePeers(dt);camUpdate(dt);hud();sendPresence(now)}catch(err){console.error(err)}
  R.render(S,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
